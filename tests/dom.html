<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Boss Auto Greet - DOM tests</title>
<!-- Panel DOM tests. Open this file directly in a browser, or run headless:
     chrome --headless=new --virtual-time-budget=6000 --dump-dom tests/dom.html
     It loads the real content scripts and drives them with synthetic mouse events. -->
<style>body{margin:0;height:1400px;background:#eceef1;font-family:-apple-system,"PingFang SC",sans-serif}</style>
<link rel="stylesheet" href="../src/content/panel.css">
<script>
// Minimal chrome.* stub, enough for store.js and panel.js
var __DB = {
  config: { searchQuery: "算法实习", includeAny: [], cities: ["上海"] },
  queue: [
    { jobId: "j1", name: "算法实习生 A", status: "pending", approved: true, location: "上海·浦东新区" },
    { jobId: "j2", name: "算法实习生 B", status: "pending", approved: true },
    { jobId: "j3", name: "算法实习生 C", status: "pending", approved: false },
    { jobId: "j4", name: "已招呼过的岗位", status: "greeted", approved: true }
  ]
};
window.chrome = {
  storage: {
    local: {
      get: function (k, cb) {
        var out = {}, ks = typeof k === "string" ? [k] : (Array.isArray(k) ? k : Object.keys(k || {}));
        ks.forEach(function (x) { if (x in __DB) out[x] = __DB[x]; });
        setTimeout(function () { cb(out); }, 0);
      },
      set: function (o, cb) { Object.assign(__DB, o); if (cb) setTimeout(cb, 0); },
      remove: function (k, cb) { (Array.isArray(k) ? k : [k]).forEach(function (x) { delete __DB[x]; }); if (cb) setTimeout(cb, 0); }
    },
    onChanged: { addListener: function () {} }
  },
  runtime: { onMessage: { addListener: function () {} }, sendMessage: function () {}, getURL: function (p) { return p; } },
  notifications: { create: function () {} },
  alarms: { create: function () {}, onAlarm: { addListener: function () {} } }
};
</script>
</head>
<body>
<pre id="out" style="position:fixed;left:12px;bottom:12px;font:12px monospace;color:#111;background:#fff;padding:8px;border:1px solid #ccc;max-width:660px;white-space:pre-wrap"></pre>

<script src="../src/lib/logger.js"></script>
<script src="../src/lib/humanize.js"></script>
<script src="../src/lib/store.js"></script>
<script src="../src/lib/selectors.js"></script>
<script src="../src/lib/cities.js"></script>
<script src="../src/lib/filters.js"></script>
<script src="../src/content/scanner.js"></script>
<script src="../src/content/executor.js"></script>
<script src="../src/content/panel.js"></script>

<script>
var L = [], P = 0, F = 0;
function ok(n, c, extra) {
  if (c) { P++; L.push("PASS  " + n); }
  else { F++; L.push("FAIL  " + n + (extra !== undefined ? "  got=" + JSON.stringify(extra) : "")); }
}
function mouse(t, el, x, y) {
  el.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, view: window }));
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

(async function () {
  await sleep(600);   // let init() -> build() -> restoreLayout() settle
  var root = document.querySelector(".bag-panel");
  ok("panel injected", !!root);
  if (!root) { document.getElementById("out").textContent = L.join("\n"); return; }

  var head = root.querySelector(".bag-head");
  var msg = root.querySelector(".bag-msg");
  var tog = root.querySelector(".bag-toggle");
  var acts = root.querySelector(".bag-actions");
  var sec = root.querySelector(".bag-secondary");

  // A. Flat action stack, no collapse-into-more layer
  ok("no more button or more box", !root.querySelector(".bag-morebtn") && !root.querySelector(".bag-more"));
  ok("actions container exists", !!acts);
  ok("two secondary buttons side by side", sec && sec.children.length === 2, sec ? sec.children.length : null);
  ok("secondary order is scan then clear",
     sec.children[0].textContent === "扫描全部" && sec.children[1].textContent === "清空队列",
     [sec.children[0].textContent, sec.children[1].textContent]);
  ok("stack order is main, secondary, debug",
     acts.children[0].className.indexOf("bag-main") >= 0 &&
     acts.children[1].className === "bag-secondary" &&
     acts.children[2].className === "bag-dbgbtn",
     [acts.children[0].className, acts.children[1].className, acts.children[2].className]);
  ok("title carries the version", root.querySelector(".bag-title").textContent.indexOf("v1") >= 0,
     root.querySelector(".bag-title").textContent);
  ok("header advertises dragging", getComputedStyle(head).cursor === "move", getComputedStyle(head).cursor);

  // B. Collapsing must beat the inline display set by showMsg()
  msg.textContent = "本页 15 个卡片：新增 15 · 已在队列 0 · 已招呼过 0 · 不符筛选 0";
  msg.style.display = "block";
  ok("message visible before collapsing", getComputedStyle(msg).display === "block");
  tog.click();
  await sleep(60);
  ok("panel collapsed", root.classList.contains("bag-collapsed"));
  ok("message hidden while collapsed despite inline display block",
     getComputedStyle(msg).display === "none", getComputedStyle(msg).display);
  ok("actions hidden while collapsed", getComputedStyle(acts).display === "none");
  ok("toggle glyph switches to plus", tog.textContent === "+", tog.textContent);
  ok("collapsed state persisted", __DB.panelCollapsed === true, __DB.panelCollapsed);
  tog.click();
  await sleep(60);
  ok("expanding restores the message", getComputedStyle(msg).display === "block", getComputedStyle(msg).display);
  ok("toggle glyph returns to dash", tog.textContent === "—", tog.textContent);

  // C. Dragging by the header
  var before = root.getBoundingClientRect();
  mouse("mousedown", head, before.left + 40, before.top + 12);
  mouse("mousemove", document, before.left + 40 - 260, before.top + 12 + 150);
  mouse("mouseup", document, before.left + 40 - 260, before.top + 12 + 150);
  await sleep(120);
  var after = root.getBoundingClientRect();
  ok("moved left by about 260px", Math.abs((before.left - after.left) - 260) < 3, before.left - after.left);
  ok("moved down by about 150px", Math.abs((after.top - before.top) - 150) < 3, after.top - before.top);
  ok("right anchor released", root.style.right === "auto", root.style.right);
  ok("position persisted", !!__DB.panelPos, __DB.panelPos);

  // D. Clamping keeps the panel on screen
  var r2 = root.getBoundingClientRect();
  mouse("mousedown", head, r2.left + 40, r2.top + 12);
  mouse("mousemove", document, r2.left + 40 - 9000, r2.top + 12 - 9000);
  mouse("mouseup", document, r2.left + 40 - 9000, r2.top + 12 - 9000);
  await sleep(120);
  var r3 = root.getBoundingClientRect();
  ok("clamped at the left edge", r3.left >= 0 && r3.left <= 4, r3.left);
  ok("clamped at the top edge", r3.top >= 0 && r3.top <= 4, r3.top);
  mouse("mousedown", head, r3.left + 40, r3.top + 12);
  mouse("mousemove", document, r3.left + 40 + 9000, r3.top + 12 + 9000);
  mouse("mouseup", document, r3.left + 40 + 9000, r3.top + 12 + 9000);
  await sleep(120);
  var r4 = root.getBoundingClientRect();
  ok("clamped inside the right edge", r4.right <= window.innerWidth, [r4.right, window.innerWidth]);
  ok("header stays reachable at the bottom", r4.top <= window.innerHeight - 40, [r4.top, window.innerHeight]);

  // E. Clicking the toggle must not turn into a drag
  var r5 = root.getBoundingClientRect();
  mouse("mousedown", tog, r5.right - 20, r5.top + 12);
  mouse("mousemove", document, r5.right - 20 - 100, r5.top + 12);
  mouse("mouseup", document, r5.right - 20 - 100, r5.top + 12);
  await sleep(80);
  ok("toggle mousedown does not start a drag",
     Math.abs(root.getBoundingClientRect().left - r5.left) < 2,
     root.getBoundingClientRect().left - r5.left);

  // F. Standing notice when this page is not the configured search
  var hint = root.querySelector(".bag-hint");
  ok("hint element exists", !!hint);
  ok("hint is shown because this file is not the configured search page",
     getComputedStyle(hint).display === "block", getComputedStyle(hint).display);
  ok("hint names the configured search term", hint.textContent.indexOf("算法实习") >= 0, hint.textContent);
  tog.click();
  await sleep(60);
  ok("hint also hides while collapsed", getComputedStyle(hint).display === "none", getComputedStyle(hint).display);
  tog.click();
  await sleep(60);

  // G. Bulk select / clear over the queue list
  var lh = root.querySelector(".bag-listhead");
  var selAll = root.querySelector(".bag-selall");
  var selNone = root.querySelector(".bag-selnone");
  var counts = root.querySelector(".bag-counts");
  function approvedOf(id) { return __DB.queue.filter(function (x) { return x.jobId === id; })[0].approved; }
  function boxes() { return [].slice.call(root.querySelectorAll(".bag-list input[type=checkbox]")); }

  ok("list header exists and is shown", !!lh && getComputedStyle(lh).display === "flex",
     lh ? getComputedStyle(lh).display : null);
  ok("counts show 3 pending with 2 approved", counts.textContent.indexOf("待处理 3") >= 0 && counts.textContent.indexOf("已勾选 2") >= 0,
     counts.textContent);
  ok("four rows rendered", boxes().length === 4, boxes().length);
  ok("greeted row checkbox is disabled", boxes().filter(function (b) { return b.disabled; }).length === 1);

  var sub2 = [].slice.call(root.querySelectorAll(".bag-sub2"));
  ok("a row with no location renders no empty separators",
     /\u00b7\s*\u00b7/.test(sub2[1].textContent) === false && sub2[1].textContent.trim().charAt(0) !== "\u00b7",
     sub2[1].textContent);

  selAll.click(); await sleep(120);
  ok("select all approves every pending job",
     approvedOf("j1") && approvedOf("j2") && approvedOf("j3"),
     [approvedOf("j1"), approvedOf("j2"), approvedOf("j3")]);
  ok("select all leaves the greeted job untouched", approvedOf("j4") === true);
  ok("counts updated to 3 approved", counts.textContent.indexOf("已勾选 3") >= 0, counts.textContent);
  ok("select-all disables itself once everything is approved", selAll.disabled === true);

  selNone.click(); await sleep(120);
  ok("clear all unapproves every pending job",
     !approvedOf("j1") && !approvedOf("j2") && !approvedOf("j3"),
     [approvedOf("j1"), approvedOf("j2"), approvedOf("j3")]);
  ok("clear all leaves the greeted job untouched", approvedOf("j4") === true);
  ok("clear-all disables itself once nothing is approved", selNone.disabled === true);
  ok("checkbox DOM reflects the cleared state",
     boxes().filter(function (b) { return !b.disabled && b.checked; }).length === 0);

  selAll.click(); await sleep(120);
  tog.click(); await sleep(60);
  ok("list header hides while collapsed", getComputedStyle(lh).display === "none", getComputedStyle(lh).display);
  tog.click(); await sleep(60);

  // H. Infinite-scroll feed: a queued job that has not been rendered yet must still be reached.
  // Reproduces the real failure: after returning from a chat only the first batch exists.
  var feed = document.createElement("div");
  document.body.appendChild(feed);
  var BATCH = 5, batches = 1, maxBatches = 6, scanCalls = 0;
  function renderFeed() {
    feed.innerHTML = "";
    for (var i = 0; i < batches * BATCH; i++) {
      var c = document.createElement("div");
      c.className = "fake-card";
      c.setAttribute("data-jid", "job" + i);
      feed.appendChild(c);
    }
  }
  renderFeed();
  var origSIV = Element.prototype.scrollIntoView;
  Element.prototype.scrollIntoView = function () {
    if (this.className === "fake-card" && batches < maxBatches) { batches++; renderFeed(); }
  };
  var origCards = window.BAG.dom.getAllCards, origXid = window.BAG.dom.extractJobId, origScan = window.BAG.scanner.scanOnce;
  window.BAG.dom.getAllCards = function () { return [].slice.call(feed.querySelectorAll(".fake-card")); };
  window.BAG.dom.extractJobId = function (c) { return c.getAttribute("data-jid"); };
  window.BAG.scanner.scanOnce = async function () { scanCalls++; return {}; };

  // H1: already rendered in the first batch, no scrolling needed
  batches = 1; renderFeed(); scanCalls = 0;
  __DB.queue = [{ jobId: "job2", name: "shallow job", status: "pending", approved: true }];
  var r1 = await window.BAG.executor.findPendingCard(__DB.queue.slice());
  ok("job in the first batch is found without loading more",
     r1 && r1.job.jobId === "job2" && batches === 1, [r1 && r1.job.jobId, batches]);
  ok("no extra scan when nothing had to be loaded", scanCalls === 0, scanCalls);

  // H2: THE REPORTED FAILURE - job only exists after several more batches load
  batches = 1; renderFeed(); scanCalls = 0;
  __DB.queue = [{ jobId: "job17", name: "deep job", status: "pending", approved: true }];
  var r2 = await window.BAG.executor.findPendingCard(__DB.queue.slice());
  ok("REGRESSION: job below the fold is reached by loading more batches",
     r2 && r2.job.jobId === "job17", r2 ? r2.job.jobId : null);
  ok("it loaded exactly as many batches as needed", batches === 4, batches);
  ok("each newly loaded batch is rescanned", scanCalls === 3, scanCalls);

  // H3: genuinely absent job - stops at the bottom instead of looping forever
  batches = 1; renderFeed(); scanCalls = 0;
  __DB.queue = [{ jobId: "job999", name: "gone", status: "pending", approved: true }];
  var t0 = Date.now();
  var r3 = await window.BAG.executor.findPendingCard(__DB.queue.slice());
  ok("absent job returns null rather than hanging", r3 === null, r3);
  ok("it stopped at the bottom of the feed", batches === maxBatches, batches);
  ok("it gave up promptly, no runaway loop", Date.now() - t0 < 9000, Date.now() - t0);

  // H4: pressing pause interrupts a long hunt between batches
  batches = 1; renderFeed(); scanCalls = 0;
  __DB.queue = [{ jobId: "job999", name: "gone", status: "pending", approved: true }];
  var calls = 0;
  var r4 = await window.BAG.executor.findPendingCard(__DB.queue.slice(), null, async function () {
    calls++; return calls <= 2;                 // allow two batches, then "pause"
  });
  ok("pause interrupts the hunt", r4 === "stopped", r4);
  ok("it stopped early instead of walking the whole feed", batches < maxBatches, batches);

  Element.prototype.scrollIntoView = origSIV;
  window.BAG.dom.getAllCards = origCards;
  window.BAG.dom.extractJobId = origXid;
  window.BAG.scanner.scanOnce = origScan;
  feed.remove();


  // I. Reading the company logo off real Boss-shaped markup, the part logic tests cannot cover.
  var lg = document.createElement("div");
  lg.innerHTML = '<div class="job-card-right"><div class="company-logo">' +
    '<img src="https://img.bosszhipin.com/x/real.png"></div>' +
    '<h3 class="company-name"><a>大厂科技</a></h3></div>';
  document.body.appendChild(lg);
  ok("logo read from a plain src", window.BAG.dom.logoSrc(lg) === "https://img.bosszhipin.com/x/real.png",
     window.BAG.dom.logoSrc(lg));

  var lg2 = document.createElement("div");
  lg2.innerHTML = '<div class="company-logo"><img data-src="https://img.bosszhipin.com/x/lazy.png"></div>';
  document.body.appendChild(lg2);
  ok("lazy loaded logo read from data-src", window.BAG.dom.logoSrc(lg2) === "https://img.bosszhipin.com/x/lazy.png",
     window.BAG.dom.logoSrc(lg2));

  var lg3 = document.createElement("div");
  lg3.innerHTML = '<div class="company-logo"><img srcset="https://img.bosszhipin.com/x/a.png 1x, b.png 2x"></div>';
  document.body.appendChild(lg3);
  ok("logo read from the first srcset entry", window.BAG.dom.logoSrc(lg3) === "https://img.bosszhipin.com/x/a.png",
     window.BAG.dom.logoSrc(lg3));

  var lg4 = document.createElement("div");
  lg4.innerHTML = '<h3 class="company-name"><a>没有图的公司</a></h3>';
  document.body.appendChild(lg4);
  ok("no img at all yields an empty src, which stays lenient", window.BAG.dom.logoSrc(lg4) === "",
     window.BAG.dom.logoSrc(lg4));

  var lg5 = document.createElement("div");
  lg5.innerHTML = '<div class="job-card-right"><img class="hr-avatar" src="https://img.bosszhipin.com/x/hr.png">' +
    '<div class="company-logo"><img src="https://img.bosszhipin.com/x/company.png"></div></div>';
  document.body.appendChild(lg5);
  ok("the recruiter avatar is not mistaken for the company logo",
     window.BAG.dom.logoSrc(lg5) === "https://img.bosszhipin.com/x/company.png", window.BAG.dom.logoSrc(lg5));

  L.push(F ? ("###### " + F + " FAILED, " + P + " passed ######")
           : ("###### ALL " + P + " DOM TESTS PASSED ######"));
  document.getElementById("out").textContent = L.join("\n");
})();
</script>
</body>
</html>
